services:

  # Application 
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wams-api:latest
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Override connection hosts to match compose service names
      ConnectionStrings__DefaultConnection: >-
        Host=${POSTGRES_HOST:-postgres};Port=5432;Database=${POSTGRES_DB:-wams};
        Username=${POSTGRES_USER:-wams};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wams-net
    volumes:
      - app_storage:/app/storage
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # PostgreSQL 
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wams}
      POSTGRES_USER: ${POSTGRES_USER:-wams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - wams-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wams} -d ${POSTGRES_DB:-wams}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

# Volumes 
volumes:
  postgres_data:
  app_storage:
  app_logs:

# Networks 
networks:
  wams-net:
    driver: bridge
